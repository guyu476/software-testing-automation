[pytest]
; Keep this file ASCII-only and WITHOUT BOM, or pytest fails to parse it.
; testpaths: when you just type "pytest", only look inside testcases/
testpaths = testcases
; pythonpath: let testcases/ import the api/ package by a plain "from api... import"
pythonpath = .
; show Chinese case names as-is instead of \uXXXX escapes
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True
